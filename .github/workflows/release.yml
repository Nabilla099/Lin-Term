name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi (contoh 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ github.event.inputs.version }}"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "Versi: $V"

      - name: Verify signing secrets
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$KS" ] || { echo "::error::Secret KEYSTORE_BASE64 belum diisi (lihat README, bagian Signing)."; exit 1; }

      - name: Install NDK
        run: |
          NDK="$(grep '^ndkVersion=' gradle.properties | cut -d= -f2)"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/lin.jks"

      - name: Build signed RELEASE APKs
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/lin.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TERMUX_APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
          TERMUX_APK_VERSION_TAG: v${{ steps.ver.outputs.name }}
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: '1'
          LIN_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Verify APKs
        run: |
          D=app/build/outputs/apk/release
          ls -lh "$D"
          for abi in arm64-v8a armeabi-v7a; do
            test -f "$D/LinTerm_v${{ steps.ver.outputs.name }}_$abi.apk" || { echo "::error::APK $abi tidak ditemukan"; exit 1; }
          done
          cd "$D" && sha256sum LinTerm_*.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          files: |
            app/build/outputs/apk/release/LinTerm_*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          generate_release_notes: true
